<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vernissage 3D Art Hall</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        .info {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            color: #fff; padding: 10px 15px; border-radius: 4px; font-family: system-ui, sans-serif;
            font-size: 14px; z-index: 100; pointer-events: none; max-width: 280px;
        }
        .controls {
            position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6);
            border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 48px 48px 48px;
            gap: 6px; z-index: 200; user-select: none;
        }
        .controls button {
            width: 48px; height: 48px; font-size: 28px; background: #f0f0f0; color: #222;
            border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .controls button:active { background: #ddd; transform: scale(0.95); }
        .clickable-art {
            cursor: pointer;
        }
        .clickable-art:hover {
            opacity: 0.8;
        }
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .video-modal.active {
            display: flex;
        }
        .video-modal-content {
            position: relative;
            max-width: 800px;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.8);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        .video-modal-close:hover {
            background: #fff;
        }
        .twitter-embed-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <a-scene background="color: #1a1a1a" fog="type: linear; color: #1a1a1a; near: 2; far: 45" antialias="true">
        <!-- Lighting -->
        <a-light type="ambient" color="#ffffff" intensity="0.85"></a-light>
        <a-light type="directional" position="3 10 5" intensity="1.1" color="#f8f0e0"></a-light>
        
        <!-- Floor -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="20" color="#d4b89c" material="roughness:0.85"></a-plane>
        
        <!-- Ceiling -->
        <a-plane position="0 5 0" rotation="90 0 0" width="40" height="20" color="#f8f8f8"></a-plane>
        
        <!-- Walls (darker gallery style) -->
        <a-plane position="0 2.5 -10" width="40" height="5" color="#2a2a2a"></a-plane>
        <a-plane position="0 2.5 10" rotation="0 180 0" width="40" height="5" color="#2a2a2a"></a-plane>
        <a-plane position="-20 2.5 0" rotation="0 90 0" width="20" height="5" color="#2a2a2a"></a-plane>
        <a-plane position="20 2.5 0" rotation="0 -90 0" width="20" height="5" color="#2a2a2a"></a-plane>

        <!-- 14 Pictures with clickable links -->
        <!-- Back wall (z = -10) -->
        <a-entity class="clickable-art" position="-15 2.5 -9.9" data-url="https://example.com/art1">
            <a-image src="grok_image_1778362432365" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="-7.5 2.5 -9.9" data-url="https://example.com/art2">
            <a-image src="grok_image_1778362352212.jpg" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="0 2.5 -9.9" data-url="https://example.com/art3">
            <a-image src="https://picsum.photos/id/160/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="7.5 2.5 -9.9" data-url="https://example.com/art4">
            <a-image src="grok_image_1778362352212.jpg" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="15 2.5 -9.9" data-url="https://example.com/art5">
            <a-image src="grok_image_1778530004875.jpg" width="3.8" height="2.85"></a-image>
        </a-entity>

        <!-- Front wall (z = +10) -->
        <a-entity class="clickable-art" position="-15 2.5 9.9" rotation="0 180 0" data-url="https://example.com/art6">
            <a-image src="grok_image_1778360949517.jpg" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="-7.5 2.5 9.9" rotation="0 180 0" data-url="https://example.com/art7">
            <a-image src="grok_image_1778530176916.jpg" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="0 2.5 9.9" rotation="0 180 0" data-url="https://example.com/art8">
            <a-image src="https://picsum.photos/id/1027/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="7.5 2.5 9.9" rotation="0 180 0" data-url="https://example.com/art9">
            <a-image src="https://picsum.photos/id/1033/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="15 2.5 9.9" rotation="0 180 0" data-url="https://example.com/art10">
            <a-image src="https://picsum.photos/id/1040/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>

        <!-- Left wall -->
        <a-entity class="clickable-art" position="-19.9 2.5 -6" rotation="0 90 0" data-url="https://example.com/art11">
            <a-image src="https://picsum.photos/id/1080/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>
        <a-entity class="clickable-art" position="-19.9 2.5 6" rotation="0 90 0" data-url="https://example.com/art12">
            <a-image src="https://picsum.photos/id/110/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>

        <!-- Right wall -->
        <a-entity class="clickable-art video-trigger" position="19.9 2.5 -6" rotation="0 -90 0" data-video-id="2053592930066051161">
            <a-image src="https://picsum.photos/id/29/1200/800" width="3.8" height="2.85"></a-image>
            <a-text value="▶ PLAY VIDEO" position="0 0 0.1" align="center" width="4" height="2" color="#ffff00" font-size="200"></a-text>
        </a-entity>
        <a-entity class="clickable-art" position="19.9 2.5 6" rotation="0 -90 0" data-url="https://example.com/art14">
            <a-image src="https://picsum.photos/id/30/1200/800" width="3.8" height="2.85"></a-image>
        </a-entity>

        <!-- Camera -->
        <a-camera id="cam" position="0 1.6 9" wasd-controls="acceleration: 45" look-controls="pointerLockEnabled: true"></a-camera>

        <!-- Title -->
        <a-text value="VERNISSAGE" position="0 4.2 0" align="center" width="18" color="#e5d5b8" opacity="0.9"></a-text>
    </a-scene>

    <div class="info">
        <strong>Vernissage 3D Hall</strong><br>
        14 artworks • 1 video<br>
        Click artworks for links/video<br>
        Desktop: WASD keys<br>
        Mobile: Use on-screen arrows
    </div>

    <!-- Video Modal -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <button class="video-modal-close" onclick="closeVideoModal()">✕</button>
            <div class="twitter-embed-container">
                <blockquote class="twitter-tweet" data-theme="dark">
                    <a href="https://x.com/i/status/2053592930066051161"></a>
                </blockquote>
                <script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
            </div>
        </div>
    </div>

    <!-- On-screen movement controls -->
    <div class="controls">
        <button id="leftBtn">←</button>
        <button id="forwardBtn">↑</button>
        <button id="rightBtn">→</button>
        <div></div>
        <button id="backBtn">↓</button>
        <div></div>
    </div>

    <script>
        // Close video modal
        function closeVideoModal() {
            document.getElementById('videoModal').classList.remove('active');
        }

        // Close on ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeVideoModal();
            }
        });

        // Handle clicks on artworks
        document.querySelectorAll('.clickable-art').forEach(entity => {
            entity.addEventListener('click', function(e) {
                e.stopPropagation();
                const videoId = this.getAttribute('data-video-id');
                const url = this.getAttribute('data-url');
                
                if (videoId) {
                    // Open video modal for Twitter video
                    document.getElementById('videoModal').classList.add('active');
                } else if (url) {
                    // Open URL in new tab for regular links
                    window.open(url, '_blank');
                }
            });
        });

        window.addEventListener('load', function () {
            const camera = document.getElementById('cam');
            let moveForward = false;
            let moveBackward = false;
            let moveLeft = false;
            let moveRight = false;
            let lastTime = Date.now();

            // Button event handlers (pointer events for desktop + mobile compatibility)
            function addButtonListeners(btnId, forwardFlag, backwardFlag, leftFlag, rightFlag) {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (forwardFlag !== undefined) moveForward = forwardFlag;
                    if (backwardFlag !== undefined) moveBackward = backwardFlag;
                    if (leftFlag !== undefined) moveLeft = leftFlag;
                    if (rightFlag !== undefined) moveRight = rightFlag;
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    if (forwardFlag !== undefined) moveForward = false;
                    if (backwardFlag !== undefined) moveBackward = false;
                    if (leftFlag !== undefined) moveLeft = false;
                    if (rightFlag !== undefined) moveRight = false;
                });
                btn.addEventListener('pointerleave', (e) => {
                    e.preventDefault();
                    if (forwardFlag !== undefined) moveForward = false;
                    if (backwardFlag !== undefined) moveBackward = false;
                    if (leftFlag !== undefined) moveLeft = false;
                    if (rightFlag !== undefined) moveRight = false;
                });
            }

            addButtonListeners('forwardBtn', true, false, false, false);
            addButtonListeners('backBtn', false, true, false, false);
            addButtonListeners('leftBtn', false, false, true, false);
            addButtonListeners('rightBtn', false, false, false, true);

            // Continuous movement loop
            function updateMovement() {
                const now = Date.now();
                const dt = Math.min((now - lastTime) / 16, 3); // normalize to ~60 fps
                lastTime = now;

                if (!camera) return;
                const pos = camera.getAttribute('position');
                const yaw = camera.object3D.rotation.y; // radians
                const s = 0.18 * dt; // walking speed (tuned for comfortable pace)

                if (moveForward) {
                    pos.x -= Math.sin(yaw) * s;
                    pos.z -= Math.cos(yaw) * s;
                }
                if (moveBackward) {
                    pos.x += Math.sin(yaw) * s;
                    pos.z += Math.cos(yaw) * s;
                }
                if (moveRight) {
                    pos.x += Math.cos(yaw) * s;
                    pos.z += -Math.sin(yaw) * s;
                }
                if (moveLeft) {
                    pos.x -= Math.cos(yaw) * s;
                    pos.z -= -Math.sin(yaw) * s;
                }

                // Keep camera at eye level and inside hall bounds (prevents extreme clipping)
                pos.y = 1.6;
                pos.x = Math.max(-18, Math.min(18, pos.x));
                pos.z = Math.max(-8, Math.min(8, pos.z));

                camera.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            }

            function animate() {
                requestAnimationFrame(animate);
                updateMovement();
            }
            animate();
        });
    </script>
</body>
</html>
