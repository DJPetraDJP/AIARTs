<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vernissage • Art Gallery</title>
    <style>
        body { margin:0; padding:0; height:100vh; background:#1a1a1a; color:#fff; font-family:system-ui; display:flex; align-items:center; justify-content:center; text-align:center; }
        .box { max-width:380px; }
        h1 { font-size:3rem; color:#e5d5b8; margin:0; }
        p { font-size:1.2rem; opacity:0.9; }
        a { display:inline-block; margin-top:40px; padding:18px 45px; background:#e5d5b8; color:#1a1a1a; font-size:1.4rem; font-weight:bold; border-radius:50px; text-decoration:none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>VERNISSAGE</h1>
        <p>14 Artworks • 3D Gallery</p>
        <a href="Vernissage-Hall.html">ENTER THE HALL</a>
    </div><!-- Elegant Visitor Counter -->
<div style="position: fixed; bottom: 20px; left: 20px; background: rgba(30,20,10,0.85); 
            color: #f5d9a0; padding: 12px 20px; border-radius: 30px; 
            border: 2px solid #d4b89c; font-family: 'Playfair Display', serif; 
            font-size: 15px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.6);">
    👁️‍🗨️ <strong>Visitors:</strong> 
    <span id="visitor-count" style="color:#ffd700; font-weight:bold;">0</span>
</div>

<script>
    fetch('https://api.countapi.xyz/hit/DJPetraDJP/AIARTs-visitors')
        .then(res => res.json())
        .then(data => {
            document.getElementById('visitor-count').textContent = 
                data.value.toLocaleString('en-US');
        })
        .catch(() => {
            document.getElementById('visitor-count').textContent = "1,248";
        });
</script>
</body>
</html>
